def resolvedNdkVersion = {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: "${System.getProperty('user.home')}/Library/Android/sdk"
    if (file("${sdkDir}/ndk/27.1.12297006/source.properties").exists()) {
        return "27.1.12297006"
    }
    return "26.1.10909125"
}()

buildscript {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: "${System.getProperty('user.home')}/Library/Android/sdk"
    def ndkVer = file("${sdkDir}/ndk/27.1.12297006/source.properties").exists() ? "27.1.12297006" : "26.1.10909125"
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = ndkVer
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 34
    ndkVersion = resolvedNdkVersion
    kotlinVersion = "1.9.24"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
