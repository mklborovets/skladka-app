pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
def nodeCmd = file("/opt/homebrew/bin/node").exists() ? "/opt/homebrew/bin/node" : "node"
def cliPath = file("../../../node_modules/@react-native-community/cli/build/bin.js").absolutePath
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand([nodeCmd, cliPath, "config"])
}
rootProject.name = 'skladka'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')
